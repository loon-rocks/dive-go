name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DIVE_VERSION: v0.19.0

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run lint
      - run: mise run generate:check

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run openapi:drift

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Start dive serve
        run: |
          docker run -d --name dive -p 8081:8081 \
            -v "$PWD/testdata/e2e:/project" -w /project \
            -e HOME=/tmp/home -e DIVE_STORAGE=memory \
            "ghcr.io/loon-rocks/dive:${DIVE_VERSION}" serve --dev-key --listen 0.0.0.0:8081
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:8081/healthz && break; sleep 0.2; done
          curl -sf http://127.0.0.1:8081/healthz
          docker cp dive:/tmp/home/.local/share/dive/serve/dev-key.pem "$RUNNER_TEMP/dev-key.pem"
      - name: Client against dive serve
        run: DIVE_E2E_URL=http://127.0.0.1:8081 DIVE_DEV_KEY="$RUNNER_TEMP/dev-key.pem" go test -race -count=1 -run TestAgainstDiveServe -v .
      - name: dive serve log
        if: always()
        run: docker logs dive || true
